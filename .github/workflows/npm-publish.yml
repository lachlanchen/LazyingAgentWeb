name: Publish npm package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published release tag to publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'lachlanchen/LazyingAgentWeb'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Validate requested release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must be an exact stable semantic version." >&2
            exit 1
          fi
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)" = "$RELEASE_TAG"
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = false
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)" = false

      - name: Check out the immutable tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js and npm registry
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Pin OIDC-capable npm CLI
        run: |
          set -euo pipefail
          npm install --global npm@12.0.2
          test "$(npm --version)" = 12.0.2

      - name: Verify tag and package authority
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          test "$(git describe --tags --exact-match HEAD)" = "$RELEASE_TAG"
          test "$(node -p "require('./package.json').name")" = '@lazyingart/agent-web'
          test "$(node -p "require('./package.json').version")" = "$VERSION"
          test "$(node -p "require('./package.json').repository.url")" = 'https://github.com/lachlanchen/LazyingAgentWeb.git'
          test "$(node -p "require('./package.json').publishConfig.registry")" = 'https://registry.npmjs.org/'
          test "$(node -p "require('./package.json').publishConfig.access")" = public

      - name: Install and test exact tag
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run check
          npm test

      - name: Reproduce and authenticate release package
        id: package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          npm pack --json --ignore-scripts > "$RUNNER_TEMP/npm-pack.json"
          TARBALL="$(node -e "const p=JSON.parse(require('node:fs').readFileSync(process.argv[1],'utf8'));if(p.length!==1||typeof p[0].filename!=='string')process.exit(1);process.stdout.write(p[0].filename)" "$RUNNER_TEMP/npm-pack.json")"
          INTEGRITY="$(node -e "const p=JSON.parse(require('node:fs').readFileSync(process.argv[1],'utf8'));if(p.length!==1||typeof p[0].integrity!=='string')process.exit(1);process.stdout.write(p[0].integrity)" "$RUNNER_TEMP/npm-pack.json")"
          test "$TARBALL" = "lazyingart-agent-web-${RELEASE_TAG#v}.tgz"
          mkdir "$RUNNER_TEMP/release-asset"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$TARBALL" --dir "$RUNNER_TEMP/release-asset"
          cmp --silent "$TARBALL" "$RUNNER_TEMP/release-asset/$TARBALL"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "integrity=$INTEGRITY" >> "$GITHUB_OUTPUT"
          sha256sum "$TARBALL"

      - name: Publish exact package with npm trusted publishing
        shell: bash
        env:
          TARBALL: ${{ steps.package.outputs.tarball }}
          EXPECTED_INTEGRITY: ${{ steps.package.outputs.integrity }}
        run: |
          set -euo pipefail
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          npm ping
          if npm view "$NAME@$VERSION" dist.integrity --json > "$RUNNER_TEMP/published-integrity.json" 2> "$RUNNER_TEMP/npm-view-error.log"; then
            PUBLISHED_INTEGRITY="$(node -e "const v=JSON.parse(require('node:fs').readFileSync(process.argv[1],'utf8'));if(typeof v!=='string')process.exit(1);process.stdout.write(v)" "$RUNNER_TEMP/published-integrity.json")"
            test "$PUBLISHED_INTEGRITY" = "$EXPECTED_INTEGRITY"
            echo "The exact package version is already published."
            exit 0
          fi
          if ! grep -Eq 'E404|404 Not Found' "$RUNNER_TEMP/npm-view-error.log"; then
            cat "$RUNNER_TEMP/npm-view-error.log" >&2
            exit 1
          fi
          npm publish "./$TARBALL" --access public --provenance
