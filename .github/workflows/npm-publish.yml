name: Publish npm package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published release tag to publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'lachlanchen/LazyingAgentWeb'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Validate requested release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must be an exact stable semantic version." >&2
            exit 1
          fi
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)" = "$RELEASE_TAG"
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = false
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)" = false

      - name: Check out the immutable tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js and npm registry
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Pin OIDC-capable npm CLI
        run: |
          set -euo pipefail
          npm install --global npm@12.0.2
          test "$(npm --version)" = 12.0.2

      - name: Verify tag and package authority
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          test "$(git describe --tags --exact-match HEAD)" = "$RELEASE_TAG"
          test "$(node -p "require('./package.json').name")" = '@lazyingart/agent-web'
          test "$(node -p "require('./package.json').version")" = "$VERSION"
          test "$(node -p "require('./package.json').repository.url")" = 'https://github.com/lachlanchen/LazyingAgentWeb.git'
          test "$(node -p "require('./package.json').publishConfig.registry")" = 'https://registry.npmjs.org/'
          test "$(node -p "require('./package.json').publishConfig.access")" = public

      - name: Reproduce and authenticate release package
        id: package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          npm pack --json --ignore-scripts > "$RUNNER_TEMP/npm-pack.json"
          TARBALL="$(node -e "const p=JSON.parse(require('node:fs').readFileSync(process.argv[1],'utf8'));const x=Array.isArray(p)?p:Object.values(p);if(x.length!==1||typeof x[0].filename!=='string')process.exit(1);process.stdout.write(x[0].filename)" "$RUNNER_TEMP/npm-pack.json")"
          EXPECTED_TARBALL="lazyingart-agent-web-${RELEASE_TAG#v}.tgz"
          if [[ "$TARBALL" != "$EXPECTED_TARBALL" ]]; then
            echo "npm pack returned '$TARBALL'; expected '$EXPECTED_TARBALL'." >&2
            exit 1
          fi
          mkdir "$RUNNER_TEMP/release-asset"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$TARBALL" --dir "$RUNNER_TEMP/release-asset"
          RELEASE_TARBALL="$RUNNER_TEMP/release-asset/$TARBALL"
          LOCAL_SHA256="$(sha256sum "$TARBALL" | cut -d ' ' -f 1)"
          RELEASE_SHA256="$(sha256sum "$RELEASE_TARBALL" | cut -d ' ' -f 1)"
          LOCAL_PAYLOAD_SHA256="$(gzip --decompress --stdout "$TARBALL" | sha256sum | cut -d ' ' -f 1)"
          RELEASE_PAYLOAD_SHA256="$(gzip --decompress --stdout "$RELEASE_TARBALL" | sha256sum | cut -d ' ' -f 1)"
          printf 'Reproduced SHA-256: %s\nRelease asset SHA-256: %s\n' "$LOCAL_SHA256" "$RELEASE_SHA256"
          printf 'Reproduced tar payload SHA-256: %s\nRelease tar payload SHA-256: %s\n' "$LOCAL_PAYLOAD_SHA256" "$RELEASE_PAYLOAD_SHA256"
          FRESH_TREE="$RUNNER_TEMP/fresh-package-tree"
          RELEASE_TREE="$RUNNER_TEMP/release-package-tree"
          mkdir "$FRESH_TREE" "$RELEASE_TREE"
          for ARCHIVE in "$TARBALL" "$RELEASE_TARBALL"; do
            if ! tar --list --gzip --file "$ARCHIVE" | awk '!/^package\// || /(^|\/)\.\.(\/|$)/ { exit 1 }'; then
              echo "Package contains a path outside its package/ root; refusing publication." >&2
              exit 1
            fi
            if ! tar --list --verbose --gzip --file "$ARCHIVE" | awk '{ kind=substr($1, 1, 1); if (kind != "-" && kind != "d") exit 1 }'; then
              echo "Package contains a link or special archive entry; refusing publication." >&2
              exit 1
            fi
          done
          tar --extract --gzip --file "$TARBALL" --directory "$FRESH_TREE" --no-same-owner
          tar --extract --gzip --file "$RELEASE_TARBALL" --directory "$RELEASE_TREE" --no-same-owner
          test -d "$FRESH_TREE/package"
          test -d "$RELEASE_TREE/package"
          if [[ -n "$(find "$FRESH_TREE/package" ! -type f ! -type d -print -quit)" ]] \
            || [[ -n "$(find "$RELEASE_TREE/package" ! -type f ! -type d -print -quit)" ]]; then
            echo "Package contains a link or special filesystem entry; refusing publication." >&2
            exit 1
          fi
          if [[ -n "$(find "$FRESH_TREE/package" -perm /7022 -print -quit)" ]] \
            || [[ -n "$(find "$RELEASE_TREE/package" -perm /7022 -print -quit)" ]]; then
            echo "Package contains a special or group/world-writable mode; refusing publication." >&2
            exit 1
          fi
          LC_ALL=C find "$FRESH_TREE/package" -printf '%y\t%m\t%s\t%P\n' \
            | awk -F '\t' 'BEGIN { OFS="\t" } { $2=substr($2, 1, 1); print }' \
            | LC_ALL=C sort > "$RUNNER_TEMP/fresh-package.manifest"
          LC_ALL=C find "$RELEASE_TREE/package" -printf '%y\t%m\t%s\t%P\n' \
            | awk -F '\t' 'BEGIN { OFS="\t" } { $2=substr($2, 1, 1); print }' \
            | LC_ALL=C sort > "$RUNNER_TEMP/release-package.manifest"
          PACKAGE_MATCH=yes
          if ! cmp --silent "$RUNNER_TEMP/fresh-package.manifest" "$RUNNER_TEMP/release-package.manifest"; then
            PACKAGE_MATCH=no
            echo "Package path/type/owner-mode/size manifest difference:" >&2
            diff --unified "$RUNNER_TEMP/fresh-package.manifest" "$RUNNER_TEMP/release-package.manifest" || true
          fi
          if ! diff --no-dereference --recursive --brief "$FRESH_TREE/package" "$RELEASE_TREE/package"; then
            PACKAGE_MATCH=no
            echo "Package file-byte difference:" >&2
            diff --no-dereference --recursive --unified "$FRESH_TREE/package" "$RELEASE_TREE/package" || true
          fi
          if [[ "$PACKAGE_MATCH" != yes ]]; then
            echo "Fresh immutable-tag package files differ from the release asset; refusing publication." >&2
            exit 1
          fi
          echo "The immutable tag and release asset have identical paths, owner modes, sizes, and file bytes."
          echo "tarball=$RELEASE_TARBALL" >> "$GITHUB_OUTPUT"

      - name: Install and test exact tag
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run check
          npm test

      - name: Publish exact package with npm trusted publishing
        shell: bash
        env:
          TARBALL: ${{ steps.package.outputs.tarball }}
        run: |
          set -euo pipefail
          npm ping
          node scripts/npm-publish-idempotent.mjs "$TARBALL"
